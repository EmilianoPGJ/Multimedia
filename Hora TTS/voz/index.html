<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Asistente de Voz</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div id="main-container">
      <h1>Asistente de Voz</h1>
      <p class="subtitle">Español de México</p>
      
      <div class="status-indicator" id="status">Presiona el botón para hablar</div>
      
      <button id="listen-button" onclick="listen()">Escuchar</button>
      
      <div class="card">
        <div class="label">Lo que dijiste:</div>
        <p id="input-area">...</p>
      </div>
      
      <div class="card">
        <div class="label">Respuesta:</div>
        <p id="output-area">...</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
